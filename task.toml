schema_version = "1.3"

[task]
name = "mijaleta/jqlite-rust"
description = "Implement a jq-compatible JSON query language (parser, generator semantics, path expressions, assignment, about 70 builtins and the CLI) in Rust with only the standard library, scored on a hidden suite of jq programs whose expected outputs come from jq 1.7."
keywords = ["rust", "interpreter", "jq", "json", "parsing", "language-implementation"]

[metadata]
difficulty = "hard"
category = "software"

[agent]
timeout_sec = 72000.0
user = "agent"

[verifier]
# Release build of the candidate (well under 5 minutes) plus 245 cases capped at 10 s each.
timeout_sec = 3600.0

[environment]
build_timeout_sec = 1800.0
network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0

[environment.env]

[verifier.env]

[solution.env]
